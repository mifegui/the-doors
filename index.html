<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Doors</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="wrap">
    <h1>The Doors</h1>
    <p class="sub">Three doors ahead. One behind. Find the way through.</p>
    <canvas id="game" width="600" height="600"></canvas>

      <span><b>WASD</b> / <b>Arrow keys</b> to move &nbsp;·&nbsp; walk into a door to use it</span>
      <button id="reset">Restart</button>
    </div>
    <div id="seed"></div>
  </div>
<script src="game.js"></script>
</body>
</html>
